services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./src:/app/src
    command: >
      streamlit run app/streamlit_app.py
      --server.address=0.0.0.0
