name: Weekly Keiba Update

on:
  schedule:
    - cron: "17 23 * * 5"
    - cron: "17 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-keiba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Verify database configuration
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is required." >&2
            exit 1
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Check weekly update status
        id: weekly-update
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: forcing weekly model update."
          else
            python scripts/weekly_update_state.py check
          fi

      - name: Crawl recent results and upcoming race entries
        if: steps.weekly-update.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/crawl_jra.py --current-month-only

      - name: Train top-three prediction model
        if: steps.weekly-update.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/train_model.py

      - name: Train upset prediction model
        if: steps.weekly-update.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/train_upset_model.py

      - name: Precompute and save upcoming race predictions
        if: steps.weekly-update.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/predict_upcoming.py

      - name: Publish updated models as a GitHub Release
        if: steps.weekly-update.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          asset_dir="$(mktemp -d)"
          cp data/model/top3_model.joblib "$asset_dir/top3_model.joblib"
          cp data/model/top3_market_model.joblib "$asset_dir/top3_market_model.joblib"
          cp data/model/metrics.json "$asset_dir/top3_metrics.json"
          cp data/model/upset/upset_model.joblib "$asset_dir/upset_model.joblib"
          cp data/model/upset/metrics.json "$asset_dir/upset_metrics.json"
          gh release create "$release_tag" \
            "$asset_dir/top3_model.joblib" \
            "$asset_dir/top3_market_model.joblib" \
            "$asset_dir/top3_metrics.json" \
            "$asset_dir/upset_model.joblib" \
            "$asset_dir/upset_metrics.json" \
            --draft \
            --title "Weekly prediction models ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Models and evaluation metrics generated by workflow run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}."
          gh release edit "$release_tag" --draft=false

      - name: Mark weekly update complete
        if: steps.weekly-update.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/weekly_update_state.py complete
