name: Weekly Keiba Update

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-keiba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database configuration
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is required." >&2
            exit 1
          fi

      - name: Crawl current-month race results and upcoming entries
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/crawl_jra.py --current-month-only

      - name: Train top-three prediction model
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/train_model.py

      - name: Train upset prediction model
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/train_upset_model.py

      - name: Publish updated models to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/model/top3_model.joblib \
            data/model/metrics.json \
            data/model/upset/upset_model.joblib \
            data/model/upset/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly prediction models"
            git push
          fi
